# Builds the game (the runtime/ submodule, bloodborne-runtime, with bloodborne-recomp inside it) for
# Apple Silicon and packages it with the launcher as Bloodborne.app in a DMG (packaging/macos.sh).
# A tag v* (git tag v0.1.0 && git push origin v0.1.0): a GitHub release with the package.
# A manual run (Actions → macOS → Run workflow, or gh workflow run macos.yml): the package as a
# workflow artifact, e.g. a test build or a check of main before tagging. Pushes do not build:
# the runtime and launcher have their own CI, and most pushes here are docs or pointer bumps.
name: macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # releases

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # git describe for the version

      # The newest Xcode on the image: the GPU library uses std::jthread and std::stop_token,
      # which Xcode 16's libc++ keeps behind -fexperimental-library.
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          clang --version | head -1

      - name: Tools
        run: brew install bash pkgconf glslang nasm cmake ninja spirv-tools clang-format

      # FSR 4.1.1 on Metal: its kernels need Xcode's Metal Toolchain, a separate component. The
      # runtime's build skips them, with a warning, when the download fails.
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain unavailable"

      # The launcher (launcher): Tauri needs Node and Rust.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Launcher checks
        working-directory: launcher
        run: |
          npm ci
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # The libraries build-deps.sh builds (MoltenVK, SDL3, FFmpeg, ...): ~1 h without the cache.
      - name: Dependency cache
        uses: actions/cache@v4
        with:
          path: runtime/deps/macos-arm64
          key: deps-macos-arm64-${{ hashFiles('runtime/scripts/macos/build-deps.sh') }}

      - name: Build
        run: BB_ARCH=arm64 bash runtime/build.sh

      - name: Package
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then export BB_VERSION=${GITHUB_REF_NAME}; fi
          bash packaging/macos.sh
          echo "PACKAGE=$(ls dist/bloodborne_mac-*.dmg)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bloodborne_mac-arm64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f $notes ]]; then
            notes=notes.md
          cat > notes.md <<'EOF'
          Bloodborne for Apple Silicon: open the DMG and drag **Bloodborne** to Applications.
          Nothing else to install. **No game files are included**: you need your own dump of
          Bloodborne with the 1.09 update: see
          [Game files](https://github.com/bloodborne-native/bloodborne-mac/blob/main/docs/guide/game-files.md).

          The app is not signed with an Apple Developer ID: the first time, right-click it and
          choose **Open** (or System Settings → Privacy & Security → Open Anyway). See
          `First start.txt` in the DMG.
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" --title "bloodborne-mac $GITHUB_REF_NAME" \
            --notes-file "$notes"
